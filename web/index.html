    <script>
      // Terapkan tema sebelum paint supaya tak ada kedip terang/gelap.
      ;(function () {
        try {
          var saved = localStorage.getItem("pemroq-theme") || localStorage.getItem("pemrok-theme")
          var dark =
            saved === "dark" ||
            (saved !== "light" &&
              window.matchMedia("(prefers-color-scheme: dark)").matches)
          if (dark) document.documentElement.dataset.theme = "dark"
        } catch (e) {
          /* abaikan, pakai tema terang */
        }
      })()
    </script>
